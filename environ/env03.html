<!doctype html>

<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Environment 03</title>
        <link href="env03.css" rel="stylesheet" type="text/css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Micro+5&family=Reenie+Beanie&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="env03.css">
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
        <script src="env03.js" defer></script>

    </head>

    <body>
            <div class="textbox">
                <p>Off in a field in the countryside, lives a <span class="highlight_01">paper cat</span>...</p>

                <p>everynight this paper cat <span class="highlight_01">practices jumping</span> as high as possible, </p>

                <p>in hopes of one day becoming... </p>

                <p class="bigline"><span class="highlight_01">☆ a shooting star ☆</span></p>
            </div>
            

            <div id="environment-output" class="text-box">
                <p>click on the element you would like to learn more about:</p>
                <div id="button-row">
                    <button id="title">title</button>
                    <button id="main-entity">jumping cat</button>
                    <button id="moon">moon</button>
                    <button id="tree">tree</button>
                    <button id="rock">rock</button>
                    <button id="clouds">cloud</button>
                    <button id="stars">stars</button>
                </div>
                <div id="msg-box">
                    <p id="message"></p>
                </div>
                
            </div>

        <div id="environment">
            <img src="moon.png" id="moon-img">
            <img src="cloud.png" id="cloud-img">
            <img src="cloud.png" id="cloud1-img">
        </div>

        <div id="main">
            <img src="rock1.png" id="rock-img">
            <img src="tree1.png" id="tree-img">
            <img src="jumping_cat.png" id="cat-img">
        </div>

    </body>
    
</html>
